<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectacles légers · rencontres vivantes — Serge Mascaro</title>
  <meta name="description" content="Spectacles légers, sensibles et adaptables pour lieux vivants, tiers-lieux, entreprises et particuliers.">
  <style>
    :root {
      --bg: #f8f4ee;
      --card-bg: #ffffff;
      --text: #2c2825;
      --muted: #665f57;
      --accent: #2f6a4c;
      --accent-soft: #e8f0eb;
      --border: rgba(80, 68, 53, 0.12);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-full: 999px;
      --max-width: 1100px;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    img, video { max-width: 100%; display: block; height: auto; }

    .container {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
    }

    /* Header & Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 244, 238, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }
    .brand { font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; }
    nav { display: flex; gap: 20px; font-size: 14px; }
    nav a:hover { color: var(--accent); }

    /* Banner / Hero */
    .hero { position: relative; text-align: center; }
    .hero img { width: 100%; height: 60vh; min-height: 380px; object-fit: cover; }
    .hero-buttons {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: white; border: none; }
    .btn-primary:hover { background: #24523a; }
    .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #f0ebe1; }

    /* Sections */
    section { padding: 70px 0; }
    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h2 { font-size: clamp(28px, 4vw, 42px); line-height: 1.2; font-weight: 700; }

    /* Grid layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 36px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* Promesse */
    .promise-text p { font-size: 18px; margin-bottom: 16px; color: var(--muted); }
    .bullets { margin-top: 24px; display: grid; gap: 12px; }
    .bullet-item { display: flex; align-items: center; gap: 12px; font-weight: 500; }

    /* Spectacles */
    .show-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 40px;
    }
    .show-header { padding: 24px 32px; border-bottom: 1px solid var(--border); }
    .show-body {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0;
    }
    .show-media { position: relative; background: #000; overflow: hidden; }
    .show-media video, .show-media img { width: 100%; height: 100%; object-fit: cover; }
    .show-info { padding: 32px; display: flex; flex-direction: column; justify-content: center; }
    .show-meta { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
    .show-info p { color: var(--muted); margin-bottom: 16px; }
    .show-actions { display: flex; gap: 12px; margin-top: 20px; }

    /* Ambiance */
    .ambiance-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .ambiance-grid img { border-radius: var(--radius-md); height: 260px; object-fit: cover; width: 100%; }
    .ambiance-quote {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 20px;
      font-size: 20px;
      font-style: italic;
      color: var(--muted);
    }

    /* À propos */
    .about-img { border-radius: var(--radius-lg); overflow: hidden; }

    /* Livre d'or (Marquee) */
    .guestbook-wrap {
      padding: 50px 0;
      overflow: hidden;
      text-align: center;
    }
    .guestbook-head { margin-bottom: 30px; }
    .marquee-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .marquee-container::before, .marquee-container::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; width: 80px; z-index: 2; pointer-events: none;
    }
    .marquee-container::before { left: 0; background: linear-gradient(to right, var(--card-bg), transparent); }
    .marquee-container::after { right: 0; background: linear-gradient(to left, var(--card-bg), transparent); }
    .marquee-track { display: flex; width: max-content; }
    .marquee-content {
      display: flex;
      gap: 16px;
      padding-right: 16px;
      animation: scroll-left linear infinite;
    }
    .marquee-track:hover .marquee-content { animation-play-state: paused; }
    .track-1 .marquee-content { animation-duration: 45s; }
    .track-2 .marquee-content { animation-duration: 55s; }
    .track-3 .marquee-content { animation-duration: 40s; }

    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .quote {
      display: inline-flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px 22px;
      border-radius: var(--radius-full);
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .quote:hover { transform: scale(1.02); border-color: var(--accent); }

    /* Contact */
    .contact-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 40px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .contact-form { display: grid; gap: 16px; margin-top: 24px; }
    .field, .textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font: inherit;
      color: var(--text);
    }
    .textarea { min-height: 120px; resize: vertical; }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 850px) {
      .grid-2, .show-body, .ambiance-grid { grid-template-columns: 1fr; }
      nav { display: none; }
      .hero img { height: 45vh; }
      .show-media { height: 250px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <div class="brand">Spectacles légers · rencontres vivantes</div>
      <nav aria-label="Navigation principale">
        <a href="#invitation">Invitation</a>
        <a href="#spectacles">Spectacles</a>
        <a href="#ambiance">Ambiance</a>
        <a href="#apropos">À propos</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="hero" id="invitation" aria-label="Introduction">
    <img src="assets/bandeau.jpg" alt="Visuel d'accueil">
    <div class="hero-buttons">
      <a href="#spectacles" class="btn btn-primary">Découvrir</a>
      <a href="#contact" class="btn btn-secondary">Accueillir</a>
