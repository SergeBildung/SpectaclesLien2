<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiers-Lieux — Spectacles légers pour lieux vivants</title>
    <meta
      name="description"
      content="Des spectacles légers, sensibles et accessibles, pensés pour les tiers-lieux, les espaces partagés et les endroits où l'on se rencontre vraiment."
    />
    <style>
      :root {
        --sand: #f7f1e8;
        --sand-deep: #efe4d3;
        --card: rgba(255, 255, 255, 0.78);
        --text: #2f2a24;
        --muted: #6d655c;
        --line: rgba(80, 68, 53, 0.12);
        --green: #2f6a4c;
        --green-soft: #97b48a;
        --shadow: 0 20px 80px rgba(0, 0, 0, 0.08);
        --radius-xl: 32px;
        --radius-lg: 24px;
        --radius-md: 18px;
        --max: 1200px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(47, 106, 76, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(151, 180, 138, 0.12), transparent 22%),
          linear-gradient(180deg, #f8f3ea 0%, #f4ecdf 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.25;
        background-image: radial-gradient(#dccfbf 0.7px, transparent 0.7px);
        background-size: 18px 18px;
      }

      img {
        max-width: 100%;
        display: block;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(var(--max), calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(16px);
        background: rgba(247, 241, 232, 0.82);
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 18px 0;
      }

      .brand-kicker,
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.32em;
        font-size: 12px;
        font-weight: 700;
        color: var(--green);
      }

      .brand-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .nav {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }

      .nav a {
        font-size: 14px;
        color: #564d44;
      }

      .hero {
        position: relative;
        min-height: 88vh;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
      }

      .hero-media,
      .hero-overlay {
        position: absolute;
        inset: 0;
      }

      .hero-media {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero-overlay {
        background: linear-gradient(110deg, rgba(20, 18, 15, 0.72) 0%, rgba(20, 18, 15, 0.38) 45%, rgba(20, 18, 15, 0.18) 100%);
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 760px;
        padding: 100px 0 84px;
        color: white;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        font-size: 14px;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      h1 {
        margin-top: 22px;
        font-size: clamp(42px, 7vw, 78px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .hero-text {
        margin-top: 22px;
        font-size: 20px;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.88);
        max-width: 670px;
      }

      .hero-actions,
      .button-row,
      .chip-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .hero-actions {
        margin-top: 34px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid transparent;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button-primary {
        background: white;
        color: var(--text);
      }

      .button-secondary {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
        color: white;
        backdrop-filter: blur(8px);
      }

      section {
        padding: 84px 0;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.58);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .section-head {
        text-align: center;
        max-width: 860px;
        margin: 0 auto 46px;
      }

      .section-head h2 {
        margin-top: 14px;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.08;
        letter-spacing: -0.03em;
      }

      .section-head p {
        margin-top: 16px;
        font-size: 18px;
        line-height: 1.75;
        color: var(--muted);
      }

      .promise-grid,
      .about-grid,
      .contact-grid {
        display: grid;
        gap: 32px;
        align-items: center;
      }

      .promise-grid {
        grid-template-columns: 1.02fr 1fr;
        padding: 20px;
      }

      .promise-image,
      .about-image {
        overflow: hidden;
        border-radius: var(--radius-lg);
      }

      .promise-image img {
        width: 100%;
        height: 100%;
        min-height: 380px;
        object-fit: cover;
      }

      .promise-content {
        padding: 12px 14px 12px 4px;
      }

      .promise-content h2,
      .about-content h2,
      .contact-copy h2 {
        margin-top: 14px;
        font-size: clamp(34px, 4.4vw, 54px);
        line-height: 1.08;
        letter-spacing: -0.03em;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .promise-copy,
      .about-copy,
      .contact-copy p {
        margin-top: 24px;
        font-size: 18px;
        line-height: 1.8;
        color: var(--muted);
      }

      .soft-box {
        margin-top: 28px;
        padding: 26px;
        border-radius: var(--radius-lg);
        background: #f7f2e8;
      }

      .soft-box h3 {
        font-size: 24px;
      }

      .bullet {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        color: var(--muted);
        line-height: 1.7;
      }

      .shows-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }

      .carousel {
        overflow: hidden;
      }

      .carousel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 22px 24px;
        border-bottom: 1px solid rgba(47, 42, 36, 0.08);
      }

      .carousel-head h3 {
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .controls {
        display: flex;
        gap: 8px;
      }

      .control {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 1px solid rgba(47, 42, 36, 0.12);
        background: white;
        cursor: pointer;
        font-size: 18px;
      }

      .slides {
        position: relative;
        min-height: 430px;
      }

      .slide {
        display: none;
        min-height: 430px;
      }

      .slide.active {
        display: block;
      }

      .slide > img,
      .slide-image {
        width: 100%;
        height: 430px;
        object-fit: cover;
      }

      .split-slide {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 430px;
      }

      .split-slide .copy,
      .text-slide {
        display: flex;
        align-items: center;
        padding: 34px;
      }

      .text-slide-inner h4,
      .split-slide h4 {
        font-size: 34px;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .text-slide-inner p,
      .split-slide p {
        margin-top: 14px;
        color: var(--muted);
        line-height: 1.8;
        font-size: 18px;
      }

      .meta {
        margin-top: 18px !important;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 12px !important;
        color: #82796d !important;
      }

      .link-slide {
        min-height: 430px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        padding: 32px;
        text-align: center;
        background: linear-gradient(135deg, #faf7f1 0%, #edf5ed 100%);
      }

      .link-slide p {
        max-width: 430px;
        color: var(--muted);
        line-height: 1.8;
        font-size: 18px;
      }

      .button-outline {
        background: transparent;
        border-color: rgba(47, 42, 36, 0.16);
      }

      .overlay-slide {
        position: relative;
        min-height: 430px;
      }

      .overlay-slide::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(20, 18, 15, 0.75), rgba(20, 18, 15, 0.18), transparent);
      }

      .overlay-copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
        padding: 32px;
        color: white;
        font-size: 32px;
        line-height: 1.18;
        max-width: 520px;
        white-space: pre-line;
      }

      .dots {
        display: flex;
        justify-content: center;
